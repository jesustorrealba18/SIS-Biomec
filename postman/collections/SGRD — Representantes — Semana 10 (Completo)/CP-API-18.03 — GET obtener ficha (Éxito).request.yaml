$kind: http-request
url: "{{base_url}}/index.php?p=representante&accion=obtenerRepresentante&id={{id_representante_test}}"
method: GET
headers:
  Cookie: "{{PHPSESSID}}"
queryParams:
  p: representante
  accion: obtenerRepresentante
  id: "{{id_representante_test}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-18.03: HTTP 200', () => pm.response.to.have.status(200));
      pm.test('CP-API-18.03: Devuelve datos personales', () => {
          const j = pm.response.json();
          pm.expect(j).to.have.property('cedula');
          pm.expect(j).to.have.property('nombres');
      });
    language: text/javascript
order: 3000
