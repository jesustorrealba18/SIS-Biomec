$kind: http-request
name: CP-API-18.09 — POST reactivar (ID Negativo -> 400)
url: "{{base_url}}/index.php?p=representante"
method: POST
headers:
  Cookie: "{{PHPSESSID}}"
  Content-Type: application/x-www-form-urlencoded
queryParams:
  p: representante
body:
  type: urlencoded
  content:
    accion: reactivar
    id_representante: "-5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-18.09: HTTP 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('CP-API-18.09: JSON de error', () => {
          const j = pm.response.json();
          pm.expect(j.status).to.eql('error');
      });
    language: text/javascript
order: 10000
