$kind: http-request
name: CP-API-18.11 — POST registrar (MIME spoofing PDF -> warning)
url: "{{base_url}}/index.php?p=representante"
method: POST
headers:
  Cookie: "{{PHPSESSID}}"
queryParams:
  p: representante
body:
  type: formdata
  content:
    - type: text
      key: accion
      value: guardar
      disabled: false
    - type: text
      key: cedula
      value: V-99887766
      disabled: false
    - type: text
      key: nombres
      value: Test
      disabled: false
    - type: text
      key: apellidos
      value: Mime
      disabled: false
    - type: text
      key: fecha_nacimiento
      value: 1985-05-20
      disabled: false
    - type: text
      key: parentesco
      value: Padre
      disabled: false
    - type: text
      key: telefono_principal
      value: "04141234567"
      disabled: false
    - type: text
      key: correo
      value: test@example.com
      disabled: false
    - type: text
      key: direccion_residencia
      value: Calle Falsa 123
      disabled: false
    - type: text
      key: atletas_ids[]
      value: "20"
      disabled: false
    - type: file
      key: foto
      src:
        - /C:/Users/admin/Desktop/Asignacion de Carriles.jpg
      disabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-18.11: Rechaza PDF falso', () => {
          const j = pm.response.json();
          pm.expect(j.status).to.eql('warning');
          pm.expect(JSON.stringify(j)).to.include('JPG/PNG');
      });
    language: text/javascript
order: 12000
