$kind: http-request
name: CP-API-18.04b — GET obtener ficha (Negativo -> 400)
url: "{{base_url}}/index.php?p=representante&accion=obtenerRepresentante&id=-5"
method: GET
headers:
  Cookie: "{{PHPSESSID}}"
queryParams:
  p: representante
  accion: obtenerRepresentante
  id: "-5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-18.04b: HTTP 400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('CP-API-18.04b: JSON de error', () => {
          const j = pm.response.json();
          pm.expect(j.message).to.include('positivo');
      });
    language: text/javascript
order: 5000
