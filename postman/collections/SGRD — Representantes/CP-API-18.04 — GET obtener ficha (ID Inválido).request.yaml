$kind: http-request
url: "{{base_url}}/index.php?p=representante&accion=obtenerRepresentante&id=-5"
method: GET
headers:
  Cookie: "{{PHPSESSID}}"
queryParams:
  p: representante
  accion: obtenerRepresentante
  id: "-5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-18.04: HTTP 200 pero retorna null', () => {
          pm.response.to.have.status(200);
          const j = pm.response.json();
          pm.expect(j).to.be.null;
      });
    language: text/javascript
order: 3000
