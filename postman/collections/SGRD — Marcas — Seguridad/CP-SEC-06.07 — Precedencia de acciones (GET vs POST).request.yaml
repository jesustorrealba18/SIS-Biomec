$kind: http-request
url: "{{base_url}}/index.php?p=marcas&accion=otra_accion"
method: POST
headers:
  Cookie: "{{PHPSESSID2}}"
  Content-Type: application/x-www-form-urlencoded
queryParams:
  p: marcas
  accion: otra_accion
body:
  type: urlencoded
  content:
    accion: eliminar
    id_marca: "999"
    motivo_eliminacion: Prueba de precedencia
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-SEC-06.07: HTTP 200 OK', () => pm.response.to.have.status(200));
      pm.test('CP-SEC-06.07: Resuelve por POST y no lanza error crítico', () => {
          const j = pm.response.json();
          pm.expect(j.status).to.not.eql('error_critico');
      });
    language: text/javascript
order: 7000
