$kind: http-request
url: "{{base_url}}/index.php?p=marcas&accion=obtenerDetalleMarca&id={{id_marca_test}}"
method: GET
headers:
  Cookie: "{{PHPSESSID}}"
queryParams:
  p: marcas
  accion: obtenerDetalleMarca
  id: "{{id_marca_test}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-06.02: HTTP 200', () => pm.response.to.have.status(200));
      const j = pm.response.json();
      pm.test('CP-API-06.02: objeto splits presente', () => pm.expect(j).to.have.property('splits'));
      pm.test('CP-API-06.02: objeto swolf_data presente', () => pm.expect(j).to.have.property('swolf_data'));
      pm.test('CP-API-06.02: historial_evolucion presente', () => pm.expect(j).to.have.property('historial_evolucion'));
    language: text/javascript
order: 2000
