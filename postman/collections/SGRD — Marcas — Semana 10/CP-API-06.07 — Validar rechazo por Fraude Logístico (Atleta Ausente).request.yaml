$kind: http-request
url: "{{base_url}}/index.php?p=marcas&accion=registrar"
method: POST
headers:
  Cookie: "{{PHPSESSID}}"
  Content-Type: application/x-www-form-urlencoded
queryParams:
  p: marcas
  accion: registrar
body:
  type: urlencoded
  content:
    id_atleta: "1"
    id_sesion: "999" # Suponiendo que en la sesión 999 este atleta NO está presente
    estilo: Libre
    distancia_m: "100"
    tipo_piscina: 50m
    tiempo_final_seg: "60.00"
    fecha: "{{fecha_prueba}}"
scripts:
  - type: afterResponse
    code: |-
      // Verificamos que el servidor NO devuelva un 200 OK, sino un código controlado de validación
      pm.test('CP-API-06.07: status es warning (Datos Rechazados)', () => {
          const jsonData = pm.response.json();
          pm.expect(jsonData.status).to.eql('warning');
      });
      pm.test('CP-API-06.07: Error de Fraude Logístico presente', () => {
          const jsonData = pm.response.json();
          // Verifica que el mensaje contenga la palabra clave de la regla de negocio
          pm.expect(JSON.stringify(jsonData)).to.include('Fraude Logístico');
      });
order: 7000