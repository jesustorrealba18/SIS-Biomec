$kind: http-request
url: "{{base_url}}/index.php?p=asistencia&accion=registrar_por_qr"
method: POST
headers:
  Cookie: "{{PHPSESSID}}"
  Content-Type: application/x-www-form-urlencoded
queryParams:
  p: asistencia
  accion: registrar_por_qr
body:
  type: urlencoded
  content:
    id_sesion: "9"
    token_qr: tokenkllsjdiwudjksjdksjdkmenrjtk
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-03.03: HTTP 200', () => pm.response.to.have.status(200));
      pm.test('CP-API-03.03: Rechazo por Token Inválido', () => {
          const jsonData = pm.response.json();
          pm.expect(jsonData.status).to.eql('error');
          // Verifica que el mensaje contenga la alerta de seguridad
          pm.expect(jsonData.message).to.include('Acceso denegado');
      });
    language: text/javascript
order: 3000
