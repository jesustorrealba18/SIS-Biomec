$kind: http-request
url: "{{base_url}}/index.php?p=antropometria&accion=reactivar"
method: POST
headers:
  Cookie: "{{PHPSESSID}}"
  Content-Type: application/x-www-form-urlencoded
queryParams:
  p: antropometria
  accion: reactivar
body:
  type: urlencoded
  content:
    accion: reactivar
    id_medicion: "{{id_medicion_test}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('CP-API-05.12: HTTP 200', () => pm.response.to.have.status(200));
      pm.test('CP-API-05.12: status=success', () => pm.expect(pm.response.json().status).to.eql('success'));
    language: text/javascript
order: 12000
